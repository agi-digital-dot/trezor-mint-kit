services:
  site:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.tdimeta.rule=Host(`srv1537297.hstgr.cloud`) && PathPrefix(`/tdi/`)
      - traefik.http.routers.tdimeta.entrypoints=websecure
      - traefik.http.routers.tdimeta.tls.certresolver=letsencrypt
      - traefik.http.services.tdimeta.loadbalancer.server.port=80
